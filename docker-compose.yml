services:
  # MySQL Database (使用已有的外部 MySQL 容器)
  mysql:
    image: mysql:9.0.0
    container_name: mysql
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=petclinic
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - 3306:3306
    volumes:
      - ~/Container/data/mysql:/var/lib/mysql

  config-server:
    image: springcommunity/spring-petclinic-config-server
    container_name: config-server
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/config-server.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      # 使用本地配置文件（native profile）
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS=file:///config-repo
      - OTEL_SERVICE_NAME=config-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=petclinic,deployment.environment=docker
      - MANAGEMENT_TRACING_ENABLED=false
    volumes:
      - ./docker/config-repo:/config-repo
      - ./docker/jfr:/jfr
      - ./docker/otel:/otel:ro
    ports:
     - 8888:8888

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: discovery-server
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/discovery-server.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      - OTEL_SERVICE_NAME=discovery-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=petclinic,deployment.environment=docker
      - MANAGEMENT_TRACING_ENABLED=false
    volumes:
      - ./docker/jfr:/jfr
      - ./docker/otel:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
    ports:
     - 8761:8761

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2"
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseContainerSupport -XX:StartFlightRecording=name=petclinic,filename=/jfr/customers-service.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - OTEL_SERVICE_NAME=customers-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=petclinic,deployment.environment=docker
      - MANAGEMENT_TRACING_ENABLED=false
    volumes:
      - ./docker/jfr:/jfr
      - ./docker/otel:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
    - 8081:8081

  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/visits-service.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - OTEL_SERVICE_NAME=visits-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=petclinic,deployment.environment=docker
      - MANAGEMENT_TRACING_ENABLED=false
    volumes:
      - ./docker/jfr:/jfr
      - ./docker/otel:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
     - 8082:8082

  vets-service:
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/vets-service.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - OTEL_SERVICE_NAME=vets-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=petclinic,deployment.environment=docker
      - MANAGEMENT_TRACING_ENABLED=false
    volumes:
      - ./docker/jfr:/jfr
      - ./docker/otel:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
     - 8083:8083

  genai-service:
    image: springcommunity/spring-petclinic-genai-service
    container_name: genai-service
    environment:
      # Fall back to a placeholder key when none is provided, so the service can
      # still start and register in Eureka (the report chain does not call the LLM).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-demo}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-demo}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/genai-service.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      - OTEL_SERVICE_NAME=genai-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=petclinic,deployment.environment=docker
      - MANAGEMENT_TRACING_ENABLED=false
    volumes:
      - ./docker/jfr:/jfr
      - ./docker/otel:/otel:ro
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 8084:8084

  api-gateway:
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/api-gateway.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=petclinic,deployment.environment=docker
      - MANAGEMENT_TRACING_ENABLED=false
    volumes:
      - ./docker/jfr:/jfr
      - ./docker/otel:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 8080:8080

  # ===== 可观测性后端：Tempo(链路) + Loki(日志) + OTel Collector =====
  # 旧的 Elasticsearch / Zipkin / Filebeat / Kibana 已被 Tempo + Loki 取代，
  # 应用经 OTel Agent -> OTLP -> Collector -> Tempo/Loki，统一在 Grafana 查看并联动。
  # 如需恢复 ES 方案，可从 git 历史还原。

  # Tempo: 接收 OTLP 链路（本地文件存储），供 Grafana 查询
  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 1280M
    ports:
      - 3200:3200

  # Loki: 接收 OTLP 日志（Loki 3.x 原生 /otlp 入口），供 Grafana 查询
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 768M
    ports:
      - 3100:3100

  # OpenTelemetry Collector: 统一接收应用 OTLP，扇出到 Tempo(链路) / Loki(日志)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 768M
    ports:
      - 4317:4317
      - 4318:4318
    depends_on:
      - tempo
      - loki

  admin-server:
    image: springcommunity/spring-petclinic-admin-server
    container_name: admin-server
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/admin-server.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      - OTEL_SERVICE_NAME=admin-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=petclinic,deployment.environment=docker
      - MANAGEMENT_TRACING_ENABLED=false
    volumes:
      - ./docker/jfr:/jfr
      - ./docker/otel:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 9090:9090

  ## Grafana / Prometheus monitoring

  # gcr.io 在国内常超时；改用 Docker Hub 镜像（官方 ghcr.io/google/cadvisor 的同步）
  cadvisor:
    image: dockette/cadvisor:0.56.2
    container_name: cadvisor
    privileged: true
    ports:
      - 8085:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    deploy:
      resources:
        limits:
          memory: 256M

  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - prometheus-server
      - tempo
      - loki
    ports:
    - 3030:3000

  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    # 开启 exemplar 存储，让 Grafana 指标曲线可直接跳转到 Tempo trace
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --enable-feature=exemplar-storage
      # 接收 Tempo metrics-generator remote_write 过来的 service-graph/span-metrics 指标
      - --web.enable-remote-write-receiver
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 9091:9090

volumes:
  tempo-data:
    driver: local
  loki-data:
    driver: local
