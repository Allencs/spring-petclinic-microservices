services:
  # MySQL Database (使用已有的外部 MySQL 容器)
  mysql:
    image: mysql:9.0.0
    container_name: mysql
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=petclinic
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - 3306:3306
    volumes:
      - ~/Container/data/mysql:/var/lib/mysql

  config-server:
    image: springcommunity/spring-petclinic-config-server
    container_name: config-server
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/config-server.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      # 使用本地配置文件（native profile）
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS=file:///config-repo
    volumes:
      - ./docker/config-repo:/config-repo
      - ./docker/jfr:/jfr
    ports:
     - 8888:8888

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: discovery-server
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/discovery-server.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
    volumes:
      - ./docker/jfr:/jfr
    depends_on:
      config-server:
        condition: service_healthy
    ports:
     - 8761:8761

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseContainerSupport -XX:StartFlightRecording=name=petclinic,filename=/jfr/customers-service.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
    volumes:
      - ./docker/jfr:/jfr
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
    - 8081:8081

  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/visits-service.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
    volumes:
      - ./docker/jfr:/jfr
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
     - 8082:8082

  vets-service:
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/vets-service.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
    volumes:
      - ./docker/jfr:/jfr
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
     - 8083:8083

  genai-service:
    image: springcommunity/spring-petclinic-genai-service
    container_name: genai-service
    environment:
      # Fall back to a placeholder key when none is provided, so the service can
      # still start and register in Eureka (the report chain does not call the LLM).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-demo}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-demo}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - JAVA_TOOL_OPTIONS=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/genai-service.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
    volumes:
      - ./docker/jfr:/jfr
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 8084:8084

  api-gateway:
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/api-gateway.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
    volumes:
      - ./docker/jfr:/jfr
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 8080:8080

  # Elasticsearch: stores both Zipkin traces and Filebeat logs
  elasticsearch:
    image: elasticsearch:7.17.12
    container_name: elasticsearch
    deploy:
      resources:
        limits:
          memory: 2048M
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - 9200:9200
    volumes:
      - elasticsearch-data:/Users/hb26933/Container/data/elasticsearch/data

  # Zipkin: receives Micrometer/Brave traces, backed by Elasticsearch
  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - STORAGE_TYPE=elasticsearch
      - ES_HOSTS=http://elasticsearch:9200
      - ES_INDEX=zipkin
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - 9411:9411

  # Filebeat: ships container logs to Elasticsearch (replaces SkyWalking log view)
  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.26
    container_name: filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Kibana: view traces (Elasticsearch) and logs (petclinic-logs-* index)
  kibana:
    image: kibana:7.17.26
    container_name: kibana
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - 5601:5601

  admin-server:
    image: springcommunity/spring-petclinic-admin-server
    container_name: admin-server
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "2"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:StartFlightRecording=name=petclinic,filename=/jfr/admin-server.jfr,maxsize=256m,disk=true,dumponexit=true,settings=default
    volumes:
      - ./docker/jfr:/jfr
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 9090:9090

  ## Grafana / Prometheus monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    ports:
      - 8085:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          memory: 256M

  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 3030:3000

  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 9091:9090

volumes:
  elasticsearch-data:
    driver: local
