# Common configuration shared by all services
server:
  shutdown: graceful

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    preferIpAddress: true

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

# Logging
logging:
  level:
    org.springframework: INFO

# Metrics & Tracing
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: petclinic
    export:
      prometheus:
        enabled: true
  # Distributed tracing via Micrometer Tracing (Brave) -> Zipkin.
  # Native to Spring Boot, so it instruments WebFlux/WebMVC/RestTemplate/WebClient
  # and propagates context with B3 headers (works on Spring Boot 4).
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    # Spring Boot 4 property path (was management.zipkin.tracing.endpoint in Boot 3.x).
    # Override ZIPKIN_ENDPOINT to point at another Zipkin-compatible collector
    # (e.g. your AI performance platform).
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

