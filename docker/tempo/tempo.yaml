server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# 由链路数据实时聚合出 service-graph / span-metrics 指标，
# 通过 remote_write 推给 Prometheus，供 Grafana 的 Service Graph / Node graph 使用。
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus-server:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

# 默认开启 service-graphs + span-metrics 两个处理器（否则 generator 不产指标）
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
