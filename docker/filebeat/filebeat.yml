filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log

processors:
  # Enrich each log line with container metadata (container.name 等)，便于在 Kibana 按服务过滤
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  # 只保留 petclinic 相关容器的日志，过滤掉基础设施容器
  - drop_event:
      when:
        not:
          regexp:
            container.name: "(config-server|discovery-server|customers-service|visits-service|vets-service|genai-service|api-gateway|admin-server)"
  # 去掉彩色控制台输出中的 ANSI 转义序列，保证 Kibana 中日志可读、可搜索
  - script:
      lang: javascript
      id: strip_ansi
      source: >
        function process(event) {
          var m = event.Get("message");
          if (m) { event.Put("message", m.replace(/\u001b\[[0-9;]*m/g, "")); }
        }

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "petclinic-logs-%{+yyyy.MM.dd}"

setup.template.name: "petclinic-logs"
setup.template.pattern: "petclinic-logs-*"
setup.ilm.enabled: false

logging.level: warning
